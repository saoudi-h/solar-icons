packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  sharp: false
  svelte-preprocess: true
  unrs-resolver: true
  vue-demi: true
  '@tailwindcss/oxide': true
  better-sqlite3: true
enablePrePostScripts: true
minimumReleaseAge: 0

# @sveltejs/package phantom-imports `typescript` without declaring it; without
# this injection it resolves the root TypeScript 7 (no JS API) instead of the
# TypeScript 6 that svelte2tsx requires for emitDts.
packageExtensions:
    "@sveltejs/package":
        dependencies:
            typescript: 6.0.3

