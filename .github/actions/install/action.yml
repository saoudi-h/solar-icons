name: 'Install'
description: 'Sets up Node.js and runs install'
inputs:
    node-version:
        description: 'Node.js version'
        required: false
        default: ''
    filter:
        description: 'pnpm project selectors to install, one per line (empty installs the whole workspace)'
        required: false
        default: ''
runs:
    using: composite
    steps:
        - name: Read Node.js version from .nvmrc
          id: nvmrc
          shell: bash
          run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

        - name: Install dependencies
          uses: pnpm/action-setup@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
              registry-url: 'https://registry.npmjs.org'
              cache: 'pnpm'

        - name: Set up Bun
          uses: oven-sh/setup-bun@v2

        - name: Setup Git User
          shell: bash
          run: |
              git config --global user.email "saoudihakim@gmail.com"
              git config --global user.name "Hakim Saoudi"

        # With a filter, pnpm installs only the selected projects and what they
        # depend on; the lockfile stays complete, so --frozen-lockfile still applies.
        - name: Install dependencies
          shell: bash
          env:
              FILTER: ${{ inputs.filter }}
          run: |
              args=()
              while IFS= read -r selector; do
                  if [ -n "$selector" ]; then args+=(--filter "$selector"); fi
              done <<< "$FILTER"
              pnpm install --frozen-lockfile "${args[@]}"
