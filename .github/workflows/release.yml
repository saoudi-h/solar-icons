name: Release

on:
    push:
        branches:
            - main
        paths-ignore:
            - 'apps/nuxt/**'
            - 'apps/vue-app/**'
            # Nothing below is published: the documentation site is deployed by
            # deploy-docs.yml and every pull request is verified by ci.yml.
            - 'apps/docs-start/**'
            - 'apps/vercel-redirect/**'
            - '.autonomos/**'
            - 'MIGRATION.md'
            - 'README.md'
            - 'docs/**'
            - '.github/workflows/ci.yml'
            - '.github/workflows/deploy-docs.yml'
            - '.github/workflows/flutter*.yml'
            - '.github/workflows/ruby.yml'
            - '.github/workflows/rails-publish.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

# id-token:write mints the GitHub OIDC JWT that `npm publish` exchanges for
# a short-lived token: every published package trusts this workflow
# (npmjs.com, package Settings, Trusted Publisher), so releases no longer
# use a long-lived token and npm generates provenance attestations
# automatically. contents:write pushes version commits and tags;
# pull-requests:write lets changesets open its version pull request.
permissions:
    contents: write
    id-token: write
    pull-requests: write

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install dependencies
              uses: ./.github/actions/install
              with:
                  node-version: ''

            # Pull requests are verified by ci.yml before they reach main, so this
            # workflow only builds, checks what publishing depends on, and
            # publishes: the types, lint, tests and skill counts are not run twice.
            - name: Build
              # The Angular playground bundles the complete dynamic catalogue and
              # exceeds the memory available on the standard GitHub runner. The
              # release gate targets the publishable packages; playground builds
              # remain available through the regular local build command.
              run: pnpm turbo build --concurrency=1 --filter='!./apps/angular-app' --filter='!@solar-icons/docs-start'

            - name: Validate package exports
              run: pnpm check:exports

            - name: Validate Figma catalog synchronization
              run: pnpm check:figma-catalog

            - name: Create Release Pull Request or Publish to NPM
              id: changesets
              uses: changesets/action@v2
              with:
                  publish-script: pnpm release
                  version-script: pnpm version-packages
                  pr-title: 'ci(changesets): :package: version packages'
                  commit-message: 'ci(changesets): version packages'
