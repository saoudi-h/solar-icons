name: Release

on:
    push:
        branches:
            - main
        paths-ignore:
            - 'apps/nuxt/**'
            - 'apps/vue-app/**'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install dependencies
              uses: ./.github/actions/install
              with:
                  node-version: ''

            - name: Build
              # The Angular playground bundles the complete dynamic catalogue and
              # exceeds the memory available on the standard GitHub runner. The
              # release gate targets the publishable packages; playground builds
              # remain available through the regular local build command.
              run: pnpm turbo build --concurrency=1 --filter='*' --filter='!./apps/angular-app'

            - name: Typecheck
              run: pnpm turbo typecheck --concurrency=1 --filter='*' --filter='!./apps/angular-app'

            - name: Lint
              run: pnpm turbo lint --concurrency=1 --filter='*' --filter='!./apps/angular-app'

            - name: Tests
              run: pnpm turbo test --concurrency=1 --filter='*' --filter='!./apps/angular-app'

            - name: Validate package exports
              run: pnpm check:exports

            - name: Validate Figma catalog synchronization
              run: pnpm check:figma-catalog

            - name: Create Release Pull Request or Publish to NPM
              id: changesets
              uses: changesets/action@v2
              with:
                  publish-script: pnpm release
                  version-script: pnpm version-packages
                  pr-title: 'ci(changesets): :package: version packages'
                  commit-message: 'ci(changesets): version packages'
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
