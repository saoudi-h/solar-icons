name: CI

# Verification of pull requests. This workflow never publishes: release.yml
# is the only publishing workflow. The `scope` job reads the changed files and
# starts only the jobs the change can affect:
#
#   packages  every package and app except the docs site (any code change)
#   site      the documentation site and what it builds from
#   checks    the cheap consistency checks, for notes and documentation only
#
# A change to the notes or the task files starts nothing.
#
# The framework test apps (apps/*-app, apps/test-react-native-icons) are local
# tools for looking at the packages: they are neither installed nor built nor
# linted here, and a change that only touches them starts nothing. Each job
# installs only the projects it works on.

on:
    pull_request:
        paths-ignore:
            - 'apps/*-app/**'
            - 'apps/test-react-native-icons/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
    scope:
        name: Scope
        runs-on: ubuntu-latest
        outputs:
            packages: ${{ steps.scope.outputs.packages }}
            site: ${{ steps.scope.outputs.site }}
            checks: ${{ steps.scope.outputs.checks }}
        steps:
            - name: Checkout branch
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Read the changed files
              id: scope
              run: |
                  all=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
                  # Files that no job needs to look at.
                  files=$(echo "$all" | grep -vE '^(\.autonomos/|MIGRATION\.md$|apps/vercel-redirect/|apps/[^/]+-app/|apps/test-react-native-icons/)' || true)
                  # Notes and documentation, checked against the icon inventory.
                  notes='^(docs/|skills/)|\.md$'
                  site_files='^apps/docs-start/'

                  packages=false
                  site=false
                  checks=false
                  if echo "$files" | grep -vE "$notes|$site_files" | grep -q .; then
                      packages=true
                  fi
                  if echo "$files" | grep -qE "$site_files" || [ "$packages" = true ]; then
                      site=true
                  fi
                  if echo "$files" | grep -qE "$notes" && [ "$site" = false ]; then
                      checks=true
                  fi

                  {
                      echo "packages=$packages"
                      echo "site=$site"
                      echo "checks=$checks"
                  } >> "$GITHUB_OUTPUT"
                  echo "packages=$packages site=$site checks=$checks"

    packages:
        name: Packages
        needs: scope
        if: needs.scope.outputs.packages == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v7

            - name: Install dependencies
              uses: ./.github/actions/install
              with:
                  node-version: ''
                  filter: |
                      .
                      ./packages/*

            # Checks that read files only go first: they fail in seconds, not
            # after the build.
            - name: Release script tests
              run: pnpm test:scripts

            - name: Validate skill catalog freshness
              run: pnpm check:skill-counts

            # Only the publishable packages: the docs site has its own job and
            # the test apps are not part of CI. One Turbo run schedules the four
            # tasks together, so a package is typechecked, linted and tested as
            # soon as it is built and a failure stops the run early.
            - name: Build, typecheck, lint and test
              run: pnpm turbo build typecheck lint test --concurrency=3 --filter='./packages/*'

            - name: Validate package exports
              run: pnpm check:exports

            - name: Validate bundle imports
              run: pnpm check:dist-imports

            # Also checked in release.yml; here it fails before the merge.
            - name: Validate Figma catalog synchronization
              run: pnpm --filter @solar-icons/figma-plugin check:catalog

    # Every committed file derived from the catalogue (Blazor manifest, Ruby
    # payload, Angular names, docs counts, Flutter widgets, Figma plugin...) is
    # regenerated in one pass and compared with what was committed. It lists
    # all the stale files at once, in about two minutes, instead of the
    # lane workflows reporting them one after the other. Fix: `pnpm catalog:sync`.
    drift:
        name: Generated files
        needs: scope
        if: needs.scope.outputs.packages == 'true' || needs.scope.outputs.site == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install dependencies
              uses: ./.github/actions/install
              with:
                  node-version: ''
                  filter: |
                      .
                      ./packages/*
                      @solar-icons/docs-start...

            - name: Check that the committed generated files are up to date
              run: pnpm catalog:check

            - name: Validate duotone output
              run: pnpm check:duotone-output

    site:
        name: Site
        needs: scope
        if: needs.scope.outputs.site == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v7

            - name: Install dependencies
              uses: ./.github/actions/install
              with:
                  node-version: ''
                  filter: |
                      .
                      @solar-icons/docs-start...

            - name: Build
              run: pnpm turbo build --concurrency=1 --filter=@solar-icons/docs-start...

            - name: Typecheck
              run: pnpm turbo typecheck --concurrency=1 --filter=@solar-icons/docs-start...

            - name: Lint
              run: pnpm turbo lint --concurrency=1 --filter=@solar-icons/docs-start...

            - name: Install the browser of the site tests
              timeout-minutes: 5
              run: pnpm --filter @solar-icons/docs-start exec playwright install --with-deps chromium

            - name: Tests
              run: pnpm turbo test --concurrency=1 --filter=@solar-icons/docs-start...

            # Counts, category list, and category thumbnails published by the
            # docs must match the catalogue. The build above regenerates them,
            # so this also fails on a stale commit. `--check-generated` is left
            # out on purpose: it needs the demo app icon lists, which are not
            # all committed.
            - name: Validate icon inventory
              run: pnpm exec tsx scripts/check-icon-inventory.ts --check-docs

    checks:
        name: Checks
        needs: scope
        if: needs.scope.outputs.checks == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v7

            - name: Install dependencies
              uses: ./.github/actions/install
              with:
                  node-version: ''
                  filter: .

            - name: Validate skill catalog freshness
              run: pnpm check:skill-counts

            - name: Validate icon inventory
              run: pnpm exec tsx scripts/check-icon-inventory.ts --check-docs
