name: Release Beta

on:
    push:
        branches:
            - beta

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

# Publishing from this workflow needs its own trusted publisher connection
# (workflow filename release-beta.yml, not configured yet) on every package;
# npm allows up to ten connections per package. id-token:write mints the OIDC
# JWT, contents:write pushes version commits and tags, pull-requests:write
# lets changesets open its version pull request. There is no token fallback
# anymore, so the first beta publish fails until those connections exist.
permissions:
    contents: write
    id-token: write
    pull-requests: write

jobs:
    release-beta:
        name: Release Beta
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install dependencies
              uses: ./.github/actions/install
              with:
                  node-version: ''

            - name: Build
              run: pnpm build

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Tests
              run: pnpm test

            - name: Validate package exports
              run: pnpm check:exports

            - name: Validate bundle imports
              run: pnpm check:dist-imports

            - name: Validate Figma catalog synchronization
              run: pnpm check:figma-catalog

            - name: Publish Beta to NPM
              id: changesets
              uses: changesets/action@v2
              with:
                  publish-script: pnpm release
                  version-script: pnpm version-packages
                  pr-title: 'ci(changesets): 🧪 beta version packages'
                  commit-message: 'ci(changesets): beta version packages'
