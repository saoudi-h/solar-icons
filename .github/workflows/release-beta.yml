name: Release Beta

on:
    push:
        branches:
            - beta

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
    release-beta:
        name: Release Beta
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install dependencies
              uses: ./.github/actions/install
              with:
                  node-version: ''

            - name: Build
              run: pnpm build

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Tests
              run: pnpm test

            - name: Validate package exports
              run: pnpm check:exports

            - name: Validate Figma catalog synchronization
              run: pnpm check:figma-catalog

            - name: Publish Beta to NPM
              id: changesets
              uses: changesets/action@v2
              with:
                  publish-script: pnpm release
                  version-script: pnpm version-packages
                  pr-title: 'ci(changesets): 🧪 beta version packages'
                  commit-message: 'ci(changesets): beta version packages'
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
